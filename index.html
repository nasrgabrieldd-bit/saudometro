<!doctype html>
<html lang="pt-BR" class="v2">
<head>
  <meta charset="UTF-8" />
  <script>
    /* Quem chega pelo navegador na página principal vê o site (site/); quem já usa o app (instalado, app da Play,
       com conta, ou vindo com ?app) abre direto o app. Qualquer endereço com parâmetro (convite, login) fica no app. */
    (function () {
      try {
        var q = location.search, hs = location.hash, ls = localStorage, ref = document.referrer || "";
        if (ref.indexOf("android-app://") === 0) ls.setItem("saudometro-play", "1");
        if (/(^|[?&])app(=|&|$)/.test(q)) ls.setItem("saudometro-web", "1");
        var standalone = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
        var hasSession = false;
        for (var i = 0; i < ls.length; i++) { var k = ls.key(i) || ""; if (k.indexOf("sb-") === 0 && k.slice(-11) === "-auth-token") { hasSession = true; break; } }
        var stay = standalone || hasSession || q || hs || ls.getItem("saudometro-play") || ls.getItem("saudometro-web");
        var bot = /bot|crawl|spider|lighthouse/i.test(navigator.userAgent);
        if (!stay && !bot && /\/(index\.html)?$/.test(location.pathname)) location.replace("site/");
      } catch (e) { /* sem storage: abre o app normalmente */ }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Saudômetro</title>
  <meta name="description" content="O encontrômetro do casal. Combine os encontros do mês, registre o humor do dia e mande sinais de saudade." />
  <meta name="author" content="Gabriel Nascimento Santos" />
  <meta name="copyright" content="© 2026 Gabriel Nascimento Santos. Todos os direitos reservados." />
  <meta name="theme-color" content="#ff6f91" />
  <link rel="icon" href="icons/icon.png" />
  <link rel="apple-touch-icon" href="icons/icon.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/desktop.css" />
</head>
<body>
  <div id="app-shell">

    <!-- tela de configuração pendente (falta preencher supabaseClient.js) -->
    <div id="screen-setup" class="stack" style="display:none; padding:32px 24px;">
      <div style="text-align:center; padding-top: 40px;">
        <div class="logo" style="font-size:48px;">🛠️</div>
        <h1>Falta configurar o Supabase</h1>
        <p class="tagline">Abra <code>js/supabaseClient.js</code> e cole a URL e a chave "anon" do seu projeto Supabase. Veja o passo a passo no README.md.</p>
      </div>
    </div>

    <!-- onboarding: criar ou entrar num casal -->
    <div id="screen-onboarding" style="display:none;"></div>

    <!-- Modo Amigos: conta separada do casal (fundação, telas ainda em construção) -->
    <div id="screen-friends" style="display:none; flex:1; flex-direction:column; min-height:0;"></div>

    <!-- app principal -->
    <div id="screen-app" style="display:none; flex:1; flex-direction:column; min-height:0;">
      <header class="topbar">
        <div>
          <div class="greeting-eyebrow" id="greeting-eyebrow">Oi</div>
          <h1 id="greeting-name">Saudômetro</h1>
        </div>
        <div class="topbar-actions">
          <span class="streak-badge" id="streak-badge" title="Dias seguidos usando o app" hidden></span>
          <button class="theme-toggle" title="Trocar tema claro/escuro">🌙</button>
          <div class="avatar" id="avatar-badge">?</div>
        </div>
      </header>

      <main id="view-container"></main>

      <nav class="bottom-nav">
        <div class="dk-logo"><img src="icons/icon.png" alt="" /><span>Saudômetro</span></div>
        <div class="dk-switch"></div>
        <button class="nav-btn" data-tab="home" title="Hoje" aria-label="Hoje"><span class="nav-icon" data-icon="home"></span><span class="nav-label">Hoje</span></button>
        <button class="nav-btn" data-tab="calendar" title="Encontros" aria-label="Encontros"><span class="nav-icon" data-icon="calendar"></span><span class="nav-label">Encontros</span></button>
        <button class="nav-btn" data-tab="mood" title="Humor" aria-label="Humor"><span class="nav-icon" data-icon="heart"></span><span class="nav-label">Humor</span></button>
        <button class="nav-btn" data-tab="notes" title="Recados" aria-label="Recados"><span class="nav-icon" data-icon="mail"></span><span class="nav-label">Recados</span><span class="nav-dot" id="notes-nav-dot" hidden></span></button>
        <button class="nav-btn" data-tab="shelf" title="Estante" aria-label="Estante"><span class="nav-icon" data-icon="book"></span><span class="nav-label">Estante</span></button>
        <button class="nav-btn" data-tab="shop" title="Lojinha" aria-label="Lojinha"><span class="nav-icon" data-icon="shopping-bag"></span><span class="nav-label">Lojinha</span></button>
        <button class="nav-btn" data-tab="profile" title="Perfil" aria-label="Perfil"><span class="nav-icon" data-icon="settings"></span><span class="nav-label">Perfil</span></button>
        <div class="dk-foot"><div class="dk-notices" id="dk-notices" hidden></div><div class="dk-wallet" id="dk-wallet" hidden></div><div class="dk-couple" id="dk-couple"></div></div>
      </nav>
    </div>

    <div id="modal-root">
      <div class="modal-overlay" id="modal-overlay"></div>
      <div class="modal-sheet" id="modal-sheet"></div>
    </div>

  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
