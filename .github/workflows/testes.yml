name: Testes

# A cada publicação (push na main) e em pull requests: roda os testes automáticos.
# No push, depois dos testes, espera o GitHub Pages publicar a versão nova e confere se o site no ar está inteiro.
# Se algo falhar, o GitHub manda e-mail pra quem fez o push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE: https://nasrgabrieldd-bit.github.io/saudometro
  SUPABASE_URL: https://dqnkgzumwwildwrlioer.supabase.co

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  site-no-ar:
    if: github.event_name != 'pull_request'
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Esperar o site publicar a versão nova
        run: |
          # compara todos os arquivos do app com o que está no ar; só segue quando estiverem idênticos
          arquivos="index.html sw.js css/styles.css $(ls js/*.js)"
          for i in $(seq 1 30); do
            diferente=""
            for f in $arquivos; do
              a=$(sha256sum "$f" | cut -d" " -f1)
              b=$(curl -fsS "$SITE/$f?t=$(date +%s)" | sha256sum | cut -d" " -f1 || true)
              [ "$a" = "$b" ] || diferente="$diferente $f"
            done
            if [ -z "$diferente" ]; then echo "Versão nova no ar (tentativa $i)."; exit 0; fi
            echo "Ainda não publicou (tentativa $i):$diferente"; sleep 15
          done
          echo "O site não publicou a versão nova em 7 minutos."; exit 1

      - name: Conferir os arquivos do site
        run: |
          falhou=0
          for f in "" index.html js/app.js js/db.js js/people.js js/errors.js css/styles.css sw.js manifest.json privacidade.html icons/icon.png; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "$SITE/$f")
            echo "$code  /$f"
            [ "$code" = "200" ] || falhou=1
          done
          curl -fsS "$SITE/index.html" | grep -q 'js/app.js' || { echo "index.html não chama js/app.js"; falhou=1; }
          exit $falhou

      - name: Conferir que o banco responde
        env:
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_vqTLMORo1lr0Rs8fZb1gNw_B60LAlpL
        run: |
          curl -fsS --retry 3 --retry-delay 5 -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" -d '{}'
          echo
